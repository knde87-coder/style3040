<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>상품목록 | 비율좋은그사람</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="top-banner">신규 회원 전 상품 무료배송</div>
    <main class="page-shell">
      <div class="page-topbar">
        <a href="/">비율좋은그사람</a>
        <div class="page-actions"><a href="/search">검색</a><a href="/cart">장바구니</a></div>
      </div>
      <p class="page-breadcrumb">HOME / SHOP / BEST</p>
      <section class="page-hero compact-page-hero">
        <div>
          <p class="section-label">PRODUCT LIST</p>
          <h1>남성복 베스트 상품</h1>
          <p>상의, 팬츠, 셔츠, 아우터까지 지금 많이 찾는 남성 데일리웨어를 모았습니다.</p>
        </div>
        <div class="filter-chip-row">
          <span class="filter-chip active">전체</span>
          <span class="filter-chip">반팔/티셔츠</span>
          <span class="filter-chip">셔츠</span>
          <span class="filter-chip">팬츠</span>
          <span class="filter-chip">아우터</span>
          <span class="filter-chip">셋업</span>
        </div>
      </section>
      <section id="catalog-grid" class="product-list-grid catalog-grid" aria-label="상품 목록"></section>
    </main>
      <script src="firebase-config.js"></script>
    <script src="firebase-store.js"></script>
    <script src="shop-data.js"></script>
    <script src="catalog.js"></script>
      <script src="integration-config.js"></script>
  </body>
</html>
