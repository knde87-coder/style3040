<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ID/PW 회원가입 | 비율좋은그남자</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="market-body auth-modal-body">
    <div class="shop-utility-bar page-utility" aria-label="회원 메뉴"><a href="/mypage">내정보</a><span>|</span><a href="/cart">장바구니</a><span>|</span><a href="/login">로그인</a><span>|</span><a href="/signup">가입</a></div>
    <main class="auth-modal-shell">
      <section class="login-modal-card">
        <a class="auth-close" href="/signup" aria-label="닫기">×</a>
        <h1>ID/PW 회원가입</h1>
        <form id="signup-form" class="login-panel-form">
          <input id="signup-id" type="text" placeholder="아이디" autocomplete="username" required />
          <input id="signup-password" type="password" placeholder="비밀번호" autocomplete="new-password" required />
          <input id="signup-password-confirm" type="password" placeholder="비밀번호 확인" autocomplete="new-password" required />
          <input id="signup-name" type="text" placeholder="이름" autocomplete="name" required />
          <button class="login-main-button" type="submit">가입하기</button>
        </form>
        <p id="auth-message" class="auth-message" aria-live="polite"></p>
      </section>
    </main>
    <script src="firebase-config.js"></script>
    <script src="firebase-store.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
