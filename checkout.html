<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>주문서 | 비율좋은그사람</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="top-banner">www.goodform.co.kr 주문서</div>
    <main class="page-shell">
      <div class="page-topbar">
        <a href="index.html">비율좋은그사람</a>
        <div class="page-actions"><a href="cart.html">장바구니</a><a href="product-list.html">상품목록</a></div>
      </div>
      <p class="page-breadcrumb">HOME / CHECKOUT</p>
      <section class="checkout-layout">
        <form id="checkout-form" class="checkout-form">
          <p class="section-label">ORDER FORM</p>
          <h1>배송지와 주문자 정보</h1>
          <label><span>주문자명</span><input name="buyer" type="text" value="홍길동" required /></label>
          <label><span>휴대폰 번호</span><input name="phone" type="tel" value="010-1234-5678" required /></label>
          <label><span>주소</span><input name="address" type="text" value="서울시 강남구" required /></label>
          <label><span>배송 요청사항</span><textarea name="memo" rows="4">문 앞에 놓아주세요.</textarea></label>
          <div class="payment-methods">
            <span class="filter-chip active">카드결제 연결 예정</span>
            <span class="filter-chip">무통장입금</span>
            <span class="filter-chip">간편결제 준비</span>
          </div>
          <button class="button primary" type="submit">주문 저장하기</button>
          <p id="checkout-message" class="form-message">현재는 주문정보를 저장하는 단계이며, 결제사는 다음 단계에서 연결합니다.</p>
        </form>
        <aside class="checkout-summary">
          <p class="section-label">ORDER ITEMS</p>
          <div id="checkout-items" class="cart-list-box"></div>
          <div class="summary-row total"><span>총 결제예정</span><strong id="checkout-total">0원</strong></div>
        </aside>
      </section>
    </main>
    <script src="firebase-config.js"></script>
    <script src="firebase-store.js"></script>
    <script src="shop-data.js"></script>
    <script src="checkout.js"></script>
      <script src="integration-config.js"></script>
  </body>
</html>
