<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>장바구니 | 비율좋은그사람</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="top-banner">신규 회원 전 상품 무료배송</div>
    <main class="page-shell">
      <div class="page-topbar">
        <a href="index.html">비율좋은그사람</a>
        <div class="page-actions"><a href="product-list.html">상품목록</a><a href="search.html">검색</a></div>
      </div>
      <p class="page-breadcrumb">HOME / CART</p>
      <section class="cart-layout">
        <div id="cart-list" class="cart-list-box"></div>
        <aside class="cart-summary-box">
          <p class="section-label">ORDER SUMMARY</p>
          <h2>예상 결제 금액</h2>
          <div class="summary-row"><span>상품금액</span><strong id="cart-product-total">0원</strong></div>
          <div class="summary-row"><span>배송비</span><strong>0원</strong></div>
          <div class="summary-row total"><span>총 결제예정</span><strong id="cart-total">0원</strong></div>
          <a class="button primary summary-button" href="checkout.html">주문 진행하기</a>
        </aside>
      </section>
    </main>
      <script src="shop-data.js"></script>
    <script src="cart.js"></script>
      <script src="integration-config.js"></script>
  </body>
</html>
