<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>검색 | 비율좋은그사람</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="top-banner">신규 회원 전 상품 무료배송</div>
    <main class="page-shell">
      <div class="page-topbar">
        <a href="/">비율좋은그사람</a>
        <div class="page-actions"><a href="/product-list">상품목록</a><a href="/cart">장바구니</a></div>
      </div>
      <p class="page-breadcrumb">HOME / SEARCH</p>
      <section class="page-hero compact-page-hero">
        <div>
          <p class="section-label">SEARCH</p>
          <h1>원하는 핏을 빠르게 찾는 검색 화면</h1>
          <p>셔츠, 반팔, 와이드팬츠, 니트, 아우터처럼 원하는 남성복을 빠르게 찾을 수 있습니다.</p>
        </div>
      </section>
      <section class="search-box-panel">
        <input id="search-input" class="search-input-large" type="search" value="셔츠" placeholder="셔츠, 팬츠, 니트, 아우터 검색" />
        <div class="filter-chip-row"><button class="filter-chip active" data-search-chip="">전체</button><button class="filter-chip" data-search-chip="셔츠">셔츠</button><button class="filter-chip" data-search-chip="팬츠">팬츠</button><button class="filter-chip" data-search-chip="니트">니트</button><button class="filter-chip" data-search-chip="셋업">셋업</button></div>
      </section>
      <section id="search-results" class="product-list-grid catalog-grid"></section>
    </main>
    <script src="shop-data.js"></script>
    <script src="search.js"></script>
      <script src="integration-config.js"></script>
  </body>
</html>
